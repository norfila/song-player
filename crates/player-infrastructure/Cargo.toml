[package]
name = "player-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
player-domain = { path = "../player-domain" }
libloading = "0.8"
lofty = "0.25"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v5"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
